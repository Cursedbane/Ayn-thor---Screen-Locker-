plugins {
    id 'com.android.application'
}

android {
    namespace 'com.brover.thorlock'
    compileSdk 35

    defaultConfig {
        applicationId 'com.brover.thorlock'
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName '0.2'
    }

    signingConfigs {
        release {
            storeFile file('release.jks')
            storePassword 'thorlock123'
            keyAlias 'thorlock'
            keyPassword 'thorlock123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
